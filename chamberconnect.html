    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

function mapSheetMember(row, i) {

                                <div className={`text-[11px] truncate font-medium ${selectedMember.id === m.id ? 'text-blue-200' : 'text-ncccc-teal'}`}>
